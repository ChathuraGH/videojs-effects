<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video.js Effects Plugin Demo</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <link href="./dist/videojs-effects.css" rel="stylesheet" />
</head>
<body>
  <div style="max-width: 960px; margin: 24px auto;">
    <video
      id="videojs-effects-player"
      class="video-js vjs-default-skin"
      controls
      preload="auto"
      width="960"
      height="540"
      playsinline
      crossorigin="anonymous"
      data-setup='{}'>
      <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a
        web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video>
  </div>

  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="./dist/videojs-effects-list.js"></script>
  <script src="./dist/videojs-effects.js"></script>
  <script>
    (function(){
      var player = videojs('videojs-effects-player');
      player.ready(function(){
        if (typeof player['videojs-effects'] === 'function') {
          player['videojs-effects']({
            defaultIntensity: 0.7,
            gridColumns: 4,
            previewSize: 120,
            livePreview: true,
            defaultEffectCode: 'none',
            previewFps: 6
          });
        } else {
          console.error('videojs-effects plugin not found');
        }
      });
    })();
  </script>
</body>
</html>
